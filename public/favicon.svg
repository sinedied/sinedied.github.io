<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Terminal window -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#1e1e1e" stroke="#569cd6" stroke-width="2.5"/>
  <!-- Title bar separator -->
  <line x1="2" y1="16" x2="62" y2="16" stroke="#569cd6" stroke-width="1.2" opacity="0.35"/>
  <!-- Traffic-light dots -->
  <circle cx="12" cy="9.5" r="2.2" fill="#ff5f57"/>
  <circle cx="20" cy="9.5" r="2.2" fill="#febc2e"/>
  <circle cx="28" cy="9.5" r="2.2" fill="#28c840"/>
  <!-- > chevron -->
  <path d="M14 30 L26 38 L14 46" fill="none" stroke="#569cd6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- _ cursor -->
  <line x1="30" y1="46" x2="46" y2="46" stroke="#569cd6" stroke-width="5.5" stroke-linecap="round"/>
</svg>
